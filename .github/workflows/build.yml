name: _Build CI

on:
  push:
    branches: [ main, master ]
    paths:
      - '**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - '**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: Parse + PSScriptAnalyzer
    runs-on: ubuntu-24.04
    # Bounded: the default 6 h would let a wedged step burn the whole budget
    # before anybody looked at the run.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache PSGallery modules
        uses: actions/cache@v4
        with:
          path: ~/.local/share/powershell/Modules
          key: psgallery-${{ runner.os }}-${{ hashFiles('**/*.psd1', '**/*.psm1') }}
          restore-keys: |
            psgallery-${{ runner.os }}-

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) { Register-PSRepository -Default }
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
              Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck
          }

      - name: Parse every shipped script
        shell: pwsh
        run: |
          $root = (Get-Item -LiteralPath $env:GITHUB_WORKSPACE).FullName
          $files = Get-ChildItem -Path $root -Recurse -Include '*.ps1', '*.psm1' -File |
            Where-Object { $_.FullName -notmatch '\\.git\\|\\.tools\\|\\obj\\|\\bin\\' }
          $failed = 0
          foreach ($f in $files) {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $failed++
              Write-Error ("$($f.Name):$($errors[0].Extent.StartLineNumber) $($errors[0].Message)")
            }
          }
          Write-Host "Parsed $($files.Count) file(s), $failed with errors"
          if ($failed -gt 0) { exit 1 }

      - name: PSScriptAnalyzer (Error severity only)
        shell: pwsh
        run: |
          $root = (Get-Item -LiteralPath $env:GITHUB_WORKSPACE).FullName
          $files = Get-ChildItem -Path $root -Recurse -Include '*.ps1', '*.psm1' -File |
            Where-Object { $_.FullName -notmatch '\\.git\\|\\.tools\\|\\obj\\|\\bin\\' }
          $count = 0
          foreach ($f in $files) {
            Invoke-ScriptAnalyzer -Path $f.FullName -ErrorAction SilentlyContinue |
              Where-Object Severity -eq 'Error' | ForEach-Object {
                Write-Error "$($_.ScriptName):$($_.Line): $($_.Message)"
                $count++
              }
          }
          if ($count -gt 0) { exit 1 }

  test:
    name: Core test suite (Ubuntu)
    runs-on: ubuntu-24.04
    needs: syntax
    # The job takes ~10 min. The default timeout is 6 h, so a wedged run
    # would burn the whole budget before anybody noticed; a runaway suite
    # must fail fast instead.
    timeout-minutes: 45
    env:
      # The state-sensitive scopes keep their own child process (that is the
      # isolation guarantee) but they now run CONCURRENTLY, and the fast
      # in-process core batch runs in the parent WHILE they work.
      #
      # Measured on this runner before the change: the 64 isolated scopes cost
      # 823 s one after another and the 50 in-process scopes another 83 s -
      # a 945 s job for 1602 tests. Four children at a time bring the same
      # work down to ~230 s. The number is the runner's core count; a larger
      # value only adds contention, because every child is single-threaded.
      GBUILD_SCOPE_PARALLELISM: 4
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache PSGallery modules
        uses: actions/cache@v4
        with:
          path: ~/.local/share/powershell/Modules
          key: psgallery-${{ runner.os }}-${{ hashFiles('**/*.psd1', '**/*.psm1') }}
          restore-keys: |
            psgallery-${{ runner.os }}-

      - name: Install Pester
        shell: pwsh
        run: |
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) { Register-PSRepository -Default }
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -ge [version]'5.0.0' -and $_.Version -lt [version]'6.0.0' })) {
              Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          }

      - name: Run the core suite
        # The runner reports the verdict through its EXIT CODE and the scope
        # list is explicit, so a scope that fails to run cannot pass silently.
        shell: pwsh
        run: |
          $root = (Get-Item -LiteralPath $env:GITHUB_WORKSPACE).FullName
          & pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'Tests/Run-CoreTests.ps1') -Scope All -StrictSkips
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Report the failing assertions
        # MUST run even when the suite failed. Without `if: always()` GitHub
        # skips every step after the first failure - and these diagnostics are
        # exactly what a red run needs. The step NAME alone does not do this.
        if: always()
        # A red suite that only says "2 failed" is not actionable: the failing
        # test NAMES and the assertion details are what a maintainer needs. The
        # runner writes the scope list per scope; re-run the failed scopes here
        # and print the expectation, so the next failure can be diagnosed from
        # the job log without downloading the artifact.
        shell: pwsh
        run: |
          $root = (Get-Item -LiteralPath $env:GITHUB_WORKSPACE).FullName
          $dir = Join-Path (Join-Path $root 'Tests') 'TestResults'
          # Where the time went: the same table the artifact carries, printed
          # into the log, so a slow-but-green run is diagnosable too.
          $timings = Join-Path $dir 'scope-timings.csv'
          if (Test-Path -LiteralPath $timings -PathType Leaf) {
            Write-Host '===== slowest scopes (scope,seconds,status,passed,skipped,total) ====='
            Get-Content -LiteralPath $timings -TotalCount 11 | ForEach-Object { Write-Host $_ }
          }
          $scopes = @()
          foreach ($f in @(Get-ChildItem -LiteralPath $dir -Filter 'failed-*.txt' -File -ErrorAction SilentlyContinue)) {
            $name = $f.BaseName -replace '^failed-', ''
            if ($name) { $scopes += $name }
            Write-Host "===== $($f.Name) ====="
            Get-Content -LiteralPath $f.FullName -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
          }
          if ($scopes.Count -eq 0) { Write-Host 'no failed scope to re-run'; exit 0 }
          foreach ($s in $scopes) {
            Write-Host "===== re-running scope $s ====="
            & pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'Tests/Run-CoreTests.ps1') -Scope $s -StrictSkips 2>&1 |
              Select-String -Pattern 'Expected|But was|at C:|Tests Passed' | ForEach-Object { Write-Host $_.Line }
          }
          exit 0

      - name: Upload test results
        # Always, not only on failure: the per-scope timing table is what
        # tells a maintainer WHERE the suite spends its time, and that is
        # exactly the question a green run cannot answer.
        if: always()
        # v7 runs on Node 24. v4/v5 declare node20, so the runner forces them
        # onto Node 24 and annotates the run: "Node.js 20 is deprecated ...".
        # v6+ is the first line that actually ships node24.
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: gbuild-testresults
          path: |
            Tests/TestResults/**
            Tests/suite-progress-*.log
          retention-days: 3
          compression-level: 9
          if-no-files-found: ignore

      - name: Diagnose Environment (on failure)
        if: failure()
        shell: bash
        run: |
          echo "=== Environment child logs ==="
          ls -la /tmp/gbuild-scope-Environment-*.log 2>/dev/null || echo "no files"
          for f in /tmp/gbuild-scope-Environment-*.log; do echo "----- $f -----"; cat "$f" 2>/dev/null; done
          echo "=== re-run Environment ==="
          root="$GITHUB_WORKSPACE"
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$root/Tests/Run-CoreTests.ps1" -Scope Environment -StrictSkips

  gbuild-flow:
    name: gbuild end-to-end flow
    runs-on: ubuntu-24.04
    needs: syntax
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache PSGallery modules
        uses: actions/cache@v4
        with:
          path: ~/.local/share/powershell/Modules
          key: psgallery-${{ runner.os }}-${{ hashFiles('**/*.psd1', '**/*.psm1') }}
          restore-keys: |
            psgallery-${{ runner.os }}-

      - name: Install Pester
        shell: pwsh
        run: |
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) { Register-PSRepository -Default }
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -ge [version]'5.0.0' -and $_.Version -lt [version]'6.0.0' })) {
              Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          }

      - name: Self-test gates
        shell: pwsh
        run: |
          $root = (Get-Item -LiteralPath $env:GITHUB_WORKSPACE).FullName
          & pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'gbuild.ps1') -SelfTest
          if ($LASTEXITCODE -ne 0) { exit 1 }

  ps51-smoke:
    name: Windows PowerShell 5.1 smoke
    runs-on: windows-latest
    needs: syntax
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) { Register-PSRepository -Default }
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -ge [version]'5.0.0' -and $_.Version -lt [version]'6.0.0' })) {
              Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          }
          $root = (Get-Item -LiteralPath $env:GITHUB_WORKSPACE).FullName
          & powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $root 'gbuild.ps1') -SelfTest
          if ($LASTEXITCODE -ne 0) { exit 1 }

  portability:
    name: POSIX launcher + smoke suite
    runs-on: ubuntu-24.04
    needs: syntax
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache PSGallery modules
        uses: actions/cache@v4
        with:
          path: ~/.local/share/powershell/Modules
          key: psgallery-${{ runner.os }}-${{ hashFiles('**/*.psd1', '**/*.psm1') }}
          restore-keys: |
            psgallery-${{ runner.os }}-

      - name: Install Pester
        shell: pwsh
        run: |
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) { Register-PSRepository -Default }
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -ge [version]'5.0.0' -and $_.Version -lt [version]'6.0.0' })) {
              Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          }

      - name: The POSIX launcher resolves the tool and runs
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          chmod +x "$root/gbuild" 2>/dev/null || true
          "$root/gbuild" -SelfTest
          if [ $? -ne 0 ]; then echo "POSIX launcher failed"; exit 1; fi

      - name: Smoke suite on Linux (critical scopes only)
        shell: pwsh
        run: |
          $root = (Get-Item -LiteralPath $env:GITHUB_WORKSPACE).FullName
          $env:GBUILD_SS_LIST = 'PhaseBVerification,PhaseCSecurity,Steps,CacheProvider,CredentialVault,Deploy,Distributed,Sast,Environment,Platform,PathUtils'
          & pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'Tests/Run-CoreTests.ps1') -StrictSkips
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Diagnose Environment (on failure)
        if: failure()
        shell: bash
        run: |
          echo "=== Environment child logs ==="
          ls -la /tmp/gbuild-scope-Environment-*.log 2>/dev/null || echo "no files"
          for f in /tmp/gbuild-scope-Environment-*.log; do echo "----- $f -----"; cat "$f" 2>/dev/null; done
          echo "=== re-run Environment ==="
          root="$GITHUB_WORKSPACE"
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$root/Tests/Run-CoreTests.ps1" -Scope Environment -StrictSkips

  macos:
    name: macOS (Apple Silicon) self-test + smoke suite
    runs-on: macos-15
    needs: syntax
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache PSGallery modules
        uses: actions/cache@v4
        with:
          path: ~/.local/share/powershell/Modules
          key: psgallery-${{ runner.os }}-${{ hashFiles('**/*.psd1', '**/*.psm1') }}
          restore-keys: |
            psgallery-${{ runner.os }}-

      - name: Install Pester
        shell: pwsh
        run: |
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) { Register-PSRepository -Default }
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -ge [version]'5.0.0' -and $_.Version -lt [version]'6.0.0' })) {
              Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          }

      - name: POSIX launcher resolves the tool and runs
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          chmod +x "$root/gbuild" 2>/dev/null || true
          "$root/gbuild" -SelfTest
          if [ $? -ne 0 ]; then echo "POSIX launcher failed on macOS"; exit 1; fi

      - name: Smoke suite on macOS (critical scopes only)
        shell: pwsh
        env:
          GBUILD_SS_LIST: 'PhaseBVerification,PhaseCSecurity,Steps,CacheProvider,CredentialVault,Deploy,Distributed,Sast,Environment,Platform,PathUtils'
        run: |
          $root = (Get-Item -LiteralPath $env:GITHUB_WORKSPACE).FullName
          & pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'Tests/Run-CoreTests.ps1') -StrictSkips
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Diagnose macOS test paths (on failure)
        if: failure()
        shell: pwsh
        run: |
          Write-Host "=== Temp paths on macOS ==="
          Write-Host "GetTempPath(): $([System.IO.Path]::GetTempPath())"
          Write-Host "TMPDIR: $env:TMPDIR"
          Write-Host "TEMP: $env:TEMP"
          Write-Host "TMP: $env:TMP"
          Write-Host "=== Isolated scope logs ==="
          $logDir = [System.IO.Path]::GetTempPath()
          Get-ChildItem -Path $logDir -Filter 'gbuild-scope-*.log' -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "----- $($_.FullName) -----"
            Get-Content $_.FullName -ErrorAction SilentlyContinue
          }

  container:
    name: Multi-architecture container build
    runs-on: ubuntu-24.04
    needs: syntax
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build linux/amd64 and linux/arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: gbuild:ci

  arm64:
    name: Native arm64 build
    runs-on: ubuntu-24.04-arm
    needs: syntax
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Self-test gates on arm64
        shell: pwsh
        run: |
          $root = (Get-Item -LiteralPath $env:GITHUB_WORKSPACE).FullName
          & pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'gbuild.ps1') -SelfTest
          if ($LASTEXITCODE -ne 0) { exit 1 }

  coverage:
    name: Code coverage
    runs-on: ubuntu-24.04
    needs: test
    # Run on both push and pull_request: a push-only skip made the gate
    # invisible, so a coverage regression could ship without any red job.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    # Pester coverage is breakpoint-based and roughly an order of magnitude
    # slower than the plain run; the sequential 114-scope run was documented
    # at ~2 h and the parallel path brings it to well under an hour. The
    # default timeout is 6 h, which is long enough to hide a wedged run -
    # this one fails fast instead.
    timeout-minutes: 120
    env:
      # Every scope is its own child process under -Coverage, so the degree
      # is the only lever on the wall clock. Four children on a four-core
      # runner is the sweet spot: more children only add contention, because
      # every child is single-threaded.
      GBUILD_SCOPE_PARALLELISM: 4
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache PSGallery modules
        uses: actions/cache@v4
        with:
          path: ~/.local/share/powershell/Modules
          key: psgallery-${{ runner.os }}-${{ hashFiles('**/*.psd1', '**/*.psm1') }}
          restore-keys: |
            psgallery-${{ runner.os }}-

      - name: Install Pester
        shell: pwsh
        run: |
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) { Register-PSRepository -Default }
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -ge [version]'5.0.0' -and $_.Version -lt [version]'6.0.0' })) {
              Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          }

      - name: Run the suite with code coverage
        shell: pwsh
        run: |
          $root = (Get-Item -LiteralPath $env:GITHUB_WORKSPACE).FullName
          # Use the scope-isolated runner, not a raw Invoke-Pester over Tests/.
          # A single-session run of every *.Tests.ps1 leaks module-global state
          # between state-sensitive scopes and produces ~16 false failures
          # (see AGENTS.md section 6). The runner also merges per-scope
          # coverage and enforces the ratchet below.
          # RATCHET, not an aspiration. The gate used to demand 85% while the
          # same run measured 57.05% of 44,589 commands across 80 files (run
          # 2026-10-27), so the job was red on every push for a number no test
          # had ever reached - and a permanently red gate hides real
          # regressions. 55 is the measured floor minus a small margin: raise
          # it whenever new tests move the number, never lower it to go green.
          & pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File (Join-Path $root 'Tests/Run-CoreTests.ps1') `
            -Scope All -StrictSkips -Coverage -MinCoveragePct 55
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report the failing assertions
        # MUST run even when the run failed - GitHub skips every step after
        # the first failure without it, and this job is where the coverage
        # gate turns red. A red coverage run that only says "2 failed" is not
        # actionable: the failing test NAMES and the assertion details are
        # what a maintainer needs.
        if: always()
        shell: pwsh
        run: |
          $root = (Get-Item -LiteralPath $env:GITHUB_WORKSPACE).FullName
          $dir = Join-Path (Join-Path $root 'Tests') 'TestResults'
          # The merged coverage baseline the ratchet measured, and where the
          # time went.
          $baseline = Join-Path $dir 'coverage-baseline.json'
          if (Test-Path -LiteralPath $baseline -PathType Leaf) {
            Write-Host '===== merged coverage baseline ====='
            $b = Get-Content -LiteralPath $baseline -Raw -Encoding UTF8 | ConvertFrom-Json
            Write-Host ("coverage {0}% of {1} lines ({2} covered / {3} missed) across {4} file(s)" -f $b.coveragePercent, $b.linesTotal, $b.linesCovered, $b.linesMissed, @($b.perFile).Count)
          }
          $timings = Join-Path $dir 'scope-timings.csv'
          if (Test-Path -LiteralPath $timings -PathType Leaf) {
            Write-Host '===== slowest scopes (scope,seconds,status,passed,skipped,total) ====='
            Get-Content -LiteralPath $timings -TotalCount 11 | ForEach-Object { Write-Host $_ }
          }
          $scopes = @()
          foreach ($f in @(Get-ChildItem -LiteralPath $dir -Filter 'failed-*.txt' -File -ErrorAction SilentlyContinue)) {
            $name = $f.BaseName -replace '^failed-', ''
            if ($name) { $scopes += $name }
            Write-Host "===== $($f.Name) ====="
            Get-Content -LiteralPath $f.FullName -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
          }
          if ($scopes.Count -eq 0) { Write-Host 'no failed scope to re-run'; exit 0 }
          foreach ($s in $scopes) {
            Write-Host "===== re-running scope $s ====="
            & pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'Tests/Run-CoreTests.ps1') -Scope $s -StrictSkips 2>&1 |
              Select-String -Pattern 'Expected|But was|at C:|Tests Passed' | ForEach-Object { Write-Host $_.Line }
          }
          exit 0

      - name: Upload test results
        # Always: the coverage baseline and the per-scope timing table are
        # the artefacts of this job, and a green run is exactly when they are
        # worth having.
        if: always()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: gbuild-coverage-results
          path: |
            Tests/TestResults/**
            Tests/suite-progress-*.log
          retention-days: 3
          compression-level: 9
          if-no-files-found: ignore
