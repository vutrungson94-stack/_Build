name: _Build CI

on:
  push:
    branches: [ main, master ]
    paths:
      - '**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - '**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: Parse + PSScriptAnalyzer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Parse every shipped script
        shell: pwsh
        run: |
          $root = (Get-Item -LiteralPath $env:GITHUB_WORKSPACE).FullName
          $files = Get-ChildItem -Path $root -Recurse -Include '*.ps1', '*.psm1' -File |
            Where-Object { $_.FullName -notmatch '\\.git\\|\\.tools\\|\\obj\\|\\bin\\' }
          $failed = 0
          foreach ($f in $files) {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $failed++
              Write-Error ("$($f.Name):$($errors[0].Extent.StartLineNumber) $($errors[0].Message)")
            }
          }
          Write-Host "Parsed $($files.Count) file(s), $failed with errors"
          if ($failed -gt 0) { exit 1 }

      - name: PSScriptAnalyzer (Error severity only)
        shell: pwsh
        run: |
          $root = (Get-Item -LiteralPath $env:GITHUB_WORKSPACE).FullName
          $files = Get-ChildItem -Path $root -Recurse -Include '*.ps1', '*.psm1' -File |
            Where-Object { $_.FullName -notmatch '\\.git\\|\\.tools\\|\\obj\\|\\bin\\' }
          $count = 0
          foreach ($f in $files) {
            Invoke-ScriptAnalyzer -Path $f.FullName -ErrorAction SilentlyContinue |
              Where-Object Severity -eq 'Error' | ForEach-Object {
                Write-Error "$($_.ScriptName):$($_.Line): $($_.Message)"
                $count++
              }
          }
          if ($count -gt 0) { exit 1 }

  test:
    name: Core test suite (fail-closed)
    runs-on: ubuntu-24.04
    needs: syntax
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run the core suite
        # The runner reports the verdict through its EXIT CODE and the scope
        # list is explicit, so a scope that fails to run cannot pass silently.
        shell: pwsh
        run: |
          $root = (Get-Item -LiteralPath $env:GITHUB_WORKSPACE).FullName
          & pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'Tests/Run-CoreTests.ps1') -Scope All -StrictSkips
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Diagnose Environment (on failure)
        if: failure()
        shell: bash
        run: |
          echo "=== Environment child logs ==="
          ls -la /tmp/gbuild-scope-Environment-*.log 2>/dev/null || echo "no files"
          for f in /tmp/gbuild-scope-Environment-*.log; do echo "----- $f -----"; cat "$f" 2>/dev/null; done
          echo "=== re-run Environment ==="
          root="$GITHUB_WORKSPACE"
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$root/Tests/Run-CoreTests.ps1" -Scope Environment -StrictSkips

  gbuild-flow:
    name: gbuild end-to-end flow
    runs-on: ubuntu-24.04
    needs: syntax
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Self-test gates
        shell: pwsh
        run: |
          $root = (Get-Item -LiteralPath $env:GITHUB_WORKSPACE).FullName
          & pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'gbuild.ps1') -SelfTest
          if ($LASTEXITCODE -ne 0) { exit 1 }

  ps51-smoke:
    name: Windows PowerShell 5.1 smoke
    runs-on: windows-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck
          $root = (Get-Item -LiteralPath $env:GITHUB_WORKSPACE).FullName
          & powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $root 'gbuild.ps1') -SelfTest
          if ($LASTEXITCODE -ne 0) { exit 1 }

  portability:
    name: POSIX launcher + full suite
    runs-on: ubuntu-24.04
    needs: syntax
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: The POSIX launcher resolves the tool and runs
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          chmod +x "$root/gbuild" 2>/dev/null || true
          "$root/gbuild" -SelfTest
          if [ $? -ne 0 ]; then echo "POSIX launcher failed"; exit 1; fi

      - name: Full suite on Linux
        shell: pwsh
        run: |
          $root = (Get-Item -LiteralPath $env:GITHUB_WORKSPACE).FullName
          & pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'Tests/Run-CoreTests.ps1') -Scope All -StrictSkips
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Diagnose Environment (on failure)
        if: failure()
        shell: bash
        run: |
          echo "=== Environment child logs ==="
          ls -la /tmp/gbuild-scope-Environment-*.log 2>/dev/null || echo "no files"
          for f in /tmp/gbuild-scope-Environment-*.log; do echo "----- $f -----"; cat "$f" 2>/dev/null; done
          echo "=== re-run Environment ==="
          root="$GITHUB_WORKSPACE"
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$root/Tests/Run-CoreTests.ps1" -Scope Environment -StrictSkips

  container:
    name: Multi-architecture container build
    runs-on: ubuntu-24.04
    needs: syntax
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build linux/amd64 and linux/arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: gbuild:ci

  arm64:
    name: Native arm64 build
    runs-on: ubuntu-24.04-arm
    needs: syntax
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Self-test gates on arm64
        shell: pwsh
        run: |
          $root = (Get-Item -LiteralPath $env:GITHUB_WORKSPACE).FullName
          & pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'gbuild.ps1') -SelfTest
          if ($LASTEXITCODE -ne 0) { exit 1 }

  coverage:
    name: Code coverage
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run the suite with code coverage
        shell: pwsh
        run: |
          $root = (Get-Item -LiteralPath $env:GITHUB_WORKSPACE).FullName
          Import-Module Pester -Force
          $config = [PesterConfiguration]::Default
          $config.Run.Path = (Join-Path $root 'Tests')
          $config.Run.Exit = $true
          $config.CodeCoverage.Enabled = $true
          $config.CodeCoverage.OutputPath = Join-Path $root 'coverage.xml'
          $config.CodeCoverage.CoveragePercentTarget = 85
          $config.CodeCoverage.Path = @((Join-Path $root 'Modules'))
          $config.CodeCoverage.RecursePaths = $true
          Invoke-Pester -Configuration $config
